services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: humandoc
      POSTGRES_PASSWORD: humandoc
      POSTGRES_DB: humandoc
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humandoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 5s, retries: 10 }

  createbucket:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/humandoc || true &&
      mc anonymous set none local/humandoc || true"

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://humandoc:humandoc@db:5432/humandoc
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://humandoc:humandoc@db:5432/humandoc
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: celery -A app.workers.celery_app worker -l info -Q humandoc -c ${WORKER_CONCURRENCY:-2}
    volumes: [worker_tmp:/tmp/humandoc]

  web:
    build: { context: ., dockerfile: Dockerfile.web }
    env_file: .env
    environment:
      DATABASE_URL_PG: postgresql://humandoc:humandoc@db:5432/humandoc
      API_INTERNAL_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  minio:
  worker_tmp:
