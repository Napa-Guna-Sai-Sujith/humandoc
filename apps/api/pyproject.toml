[project]
name = "humandoc-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "psycopg2-binary>=2.9.9",
  "alembic==1.13.2",
  "redis>=6.1.0",
  "celery==5.4.0",
  "boto3==1.35.20",
  "anthropic==0.37.1",
  "PyMuPDF==1.25.5",
  "pdfplumber==0.11.4",
  "python-docx==1.1.2",
  "python-pptx==1.0.2",
  "pytesseract==0.3.13",
  "Pillow==11.0.0",
  "langdetect==1.0.9",
  "bcrypt==4.2.1",
  "cryptography==43.0.1",
  "python-multipart==0.0.9",
  "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "ruff==0.6.9",
  "anyio==4.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
